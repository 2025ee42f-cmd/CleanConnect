<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CleanConnect{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><a class="brand" href="/">🌿 CleanConnect</a><div class="navlinks">{% if user %}<a href="/dashboard">Dashboard</a>{% if user.role=='citizen' %}<a href="/profile">Impact</a>{% else %}<a href="/crew">Crew</a>{% endif %}<button class="iconbtn" onclick="showNotifications()">🔔<span id="bell" class="badge">0</span></button><form method="post" action="/logout"><button class="linkbtn">Logout</button></form>{% else %}<a href="/login">Login</a><a class="btn small" href="/register">Join</a>{% endif %}</div></nav><main>{% block content %}{% endblock %}</main><div id="toast" class="toast"></div><div id="notifPanel" class="notifpanel hidden"><div class="panelhead"><b>Notifications</b><button onclick="closeNotifications()">×</button></div><div id="notifList"></div></div><script src="{{ url_for('static',filename='app.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
