{% extends 'base.html' %}{% block title %}My Impact — CleanConnect{% endblock %}{% block content %}<section class="pagehead"><div><span class="eyebrow">MY IMPACT</span><h1>Small actions. City-scale change.</h1></div><div class="score"><strong id="points">—</strong><small>EcoPoints</small><b id="lvl">—</b></div></section><section class="layout"><div><div class="card"><h2>My badges</h2><div id="badges" class="badges"></div></div><div class="card"><h2>Rewards</h2><div id="rewards" class="rewards"></div></div><a class="btn" href="/certificate">Print Green Citizen Certificate</a></div><div class="card"><h2>City leaderboard</h2><div id="leader"></div></div></section>{% endblock %}{% block scripts %}<script>async function loadProfile(){const [m,l]=await Promise.all([fetch('/api/me'),fetch('/api/leaderboard')]);const u=await m.json(),x=await l.json();points.textContent=u.eco_points;lvl.textContent=u.level;badges.innerHTML=(u.badges||[]).map(b=>`<span>🏅 ${esc(b)}</span>`).join('')||'<p class="muted">Your first report unlocks badges.</p>';rewards.innerHTML=[['Digital Green Citizen Certificate',20],['Priority cleanup voucher',50],['₹50 mobile recharge',100],['Segregation bin',180],['₹200 grocery voucher',250]].map(([r,c])=>`<div class="reward"><div><b>${esc(r)}</b><small>${c} EcoPoints</small></div><button class="btn tiny" onclick="redeem(${JSON.stringify(r)})">Redeem</button></div>`).join('');leader.innerHTML=x.leaderboard.map(z=>`<div class="leader"><b>${z.rank===1?'👑 ':''}#${z.rank}</b><span>${esc(z.name)}</span><strong>${z.eco_points}</strong></div>`).join('')}async function redeem(reward){const r=await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reward})});const d=await r.json();toast(r.ok?'Reward redeemed! '+reward:d.error,r.ok?'':'error');if(r.ok)loadProfile()}loadProfile();setInterval(loadProfile,8000);</script>{% endblock %}
