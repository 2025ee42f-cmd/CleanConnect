<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CleanConnect</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">CC</span>
      CleanConnect
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="report.html">Report an Issue</a>
      <a href="reports.html">Reports</a>
      <a href="recruit.html">Join the Crew</a>
    </div>
    <div id="navAuthSlot"></div>
  </div>
</nav>

<main class="page">
  <div class="container">
    <form class="glass auth-shell" id="loginForm" novalidate>
      <h1 class="form-title">Welcome back</h1>
      <p class="form-sub">Log in to CleanConnect to report issues or manage cleanup work.</p>

      <div class="alert alert-error" id="loginError"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Log In</button>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
    </form>
  </div>
</main>

<footer>CleanConnect · Public Service Platform</footer>

<script src="static/js/api.js"></script>
<script src="static/js/navbar.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errBox = document.getElementById("loginError");
  errBox.classList.remove("show");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const { user } = await CC.api("auth-login", { method: "POST", body: { email, password } });
    CC.setSession(user);
    CC.redirectByRole(user.role);
  } catch (err) {
    errBox.textContent = err.message || "Login failed.";
    errBox.classList.add("show");
    btn.disabled = false;
    btn.textContent = "Log In";
  }
});

if (CC.isLoggedIn()) {
  CC.redirectByRole(CC.getUser()?.role);
}
</script>
</body>
</html>
